
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>SMART HOME CONTROL</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b1220;
  --panel:#172338;
  --panel2:#202f47;
  --text:#f4f7fb;
  --muted:#9aabc1;
  --accent:#f4bd35;
  --green:#35d39a;
  --red:#f47777;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial, sans-serif;min-height:100vh;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:20px 24px;border-bottom:1px solid #29374d;
}
.brand{font-size:21px;font-weight:800;letter-spacing:1px}
.brand span{color:var(--accent)}
.status{font-size:12px;color:var(--muted)}
.status i{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--red);margin-right:7px
}
.status.online i{background:var(--green)}
main{max-width:1100px;margin:auto;padding:22px}
.cards{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;
}
.card{
  background:var(--panel);border:1px solid #293950;
  border-radius:22px;padding:20px;min-width:0;
}
.card-head{display:flex;justify-content:space-between;align-items:center}
.card h2{margin:0;font-size:20px}
.state{
  font-size:12px;padding:7px 12px;border-radius:30px;
  background:#303b4c;color:var(--muted)
}
.state.on{background:#123d35;color:var(--green)}
.gauge{
  width:min(100%,340px);margin:18px auto 5px;position:relative;
}
.gauge svg{width:100%;display:block;overflow:visible}
.gauge-value{
  position:absolute;left:0;right:0;bottom:8px;
  text-align:center;font-size:34px;font-weight:800;
}
.gauge-value small{font-size:13px;color:var(--muted);font-weight:500}
.slider-wrap{margin:14px 0 20px}
input[type=range]{
  width:100%;accent-color:var(--accent);cursor:pointer;
}
.range-labels{
  display:flex;justify-content:space-between;color:var(--muted);
  font-size:12px;margin-top:5px
}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{
  border:0;border-radius:12px;padding:14px 10px;
  color:white;font-size:15px;font-weight:700;cursor:pointer;
  background:var(--panel2);transition:.15s;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:wait}
button.on-btn{background:#14634d}
button.off-btn{background:#633b43}
button.preset{border:1px solid #43516a}
button.preset.active{background:#66501d;border-color:var(--accent);color:#ffe39a}
.voice{
  margin-top:20px;background:var(--panel);border:1px solid #293950;
  border-radius:22px;padding:22px;display:flex;
  align-items:center;justify-content:space-between;gap:20px;
}
.voice h2{margin:0 0 7px;font-size:19px}
.voice p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.mic{
  width:62px;height:62px;border-radius:50%;background:#66501d;
  color:#ffe39a;font-size:25px;flex-shrink:0
}
.mic.listening{background:#8a303b;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #8a303b33}}
.message{
  min-height:22px;margin:15px 2px 0;color:var(--muted);
  font-size:13px
}
.settings{
  margin-top:22px;background:var(--panel);border-radius:16px;
  padding:15px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;
}
.settings input{
  width:100%;min-width:0;background:#0d1727;border:1px solid #34445c;
  border-radius:9px;padding:11px;color:white;
}
.settings button{padding:10px 15px}
footer{text-align:center;color:#71829a;font-size:12px;padding:22px}
@media(max-width:650px){
  header{padding:16px}
  main{padding:14px}
  .cards{grid-template-columns:1fr}
  .voice{padding:17px}
  .settings{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand">SMART HOME <span>CONTROL</span></div>
  <div class="status" id="connection"><i></i><span>Sunucu kontrol ediliyor</span></div>
</header>

<main>
  <section class="cards" id="ledCards"></section>

  <section class="voice">
    <div>
      <h2>Sesli Kontrol</h2>
      <p id="voiceText">Mikrofona bas ve komutunu söyle.<br>
      Örnek: “LED 1 parlaklığını yüzde 35 yap.”</p>
    </div>
    <button class="mic" id="micButton" title="Sesli komut">🎙</button>
  </section>

  <div class="message" id="message">Kontrol paneli hazır.</div>

  <section class="settings">
    <input id="serverUrl" placeholder="Cloudflare sunucu URL">
    <input id="token" type="password" placeholder="CONTROL_TOKEN">
    <button onclick="saveSettings()">BAĞLAN</button>
  </section>
</main>

<footer>SMART HOME CONTROL · İki bağımsız LED kontrolü</footer>

<script>
const $ = id => document.getElementById(id);

let api = localStorage.getItem("shc_url") || location.origin;
let token = localStorage.getItem("shc_token") || "";
let data = {
  led1:{on:false,brightness:100},
  led2:{on:false,brightness:100}
};
let busy = false;

$("serverUrl").value = api;
$("token").value = token;

function message(text){
  $("message").textContent = text;
}

function render(){
  $("ledCards").innerHTML = [1,2].map(n=>{
    const led = data["led"+n];
    const value = led.brightness;
    const circumference = 377;
    const dash = circumference * value / 100;

    return `
    <article class="card">
      <div class="card-head">
        <h2>💡 LED ${n}</h2>
        <span class="state ${led.on ? "on" : ""}">
          ${led.on ? "AÇIK" : "KAPALI"}
        </span>
      </div>

      <div class="gauge">
        <svg viewBox="0 0 300 175" aria-label="Parlaklık göstergesi">
          <path d="M30 150 A120 120 0 0 1 270 150"
            fill="none" stroke="#35445a" stroke-width="16"
            stroke-linecap="round"/>
          <path d="M30 150 A120 120 0 0 1 270 150"
            fill="none" stroke="#f4bd35" stroke-width="16"
            stroke-linecap="round"
            stroke-dasharray="${dash} ${circumference}"/>
        </svg>
        <div class="gauge-value">${value}%<br>
          <small>PARLAKLIK</small>
        </div>
      </div>

      <div class="slider-wrap">
        <input type="range" min="0" max="100" value="${value}"
          aria-label="LED ${n} parlaklığı"
          oninput="preview(${n},this.value)"
          onchange="setBrightness(${n},this.value)">
        <div class="range-labels"><span>0%</span><span>100%</span></div>
      </div>

      <div class="buttons">
        <button class="on-btn" onclick="command(${n},'on')">AÇ</button>
        <button class="off-btn" onclick="command(${n},'off')">KAPAT</button>
        <button class="preset ${value===50?'active':''}"
          onclick="setBrightness(${n},50)">%50</button>
        <button class="preset ${value===100?'active':''}"
          onclick="setBrightness(${n},100)">%100</button>
      </div>
    </article>`;
  }).join("");
}

function preview(n,value){
  data["led"+n].brightness = Number(value);
  data["led"+n].on = Number(value)>0;
  render();
  const slider = document.querySelectorAll('input[type="range"]')[n-1];
  if(slider) slider.value=value;
}

async function request(path,body){
  if(!token) throw new Error("Önce CONTROL_TOKEN girip BAĞLAN'a bas.");
  const response = await fetch(api.replace(/\/$/,"")+path,{
    method:body ? "POST" : "GET",
    headers:{
      "Authorization":"Bearer "+token,
      ...(body ? {"Content-Type":"application/json"} : {})
    },
    body:body ? JSON.stringify(body) : undefined
  });
  const result = await response.json();
  if(!response.ok || !result.ok){
    throw new Error(result.error || "Sunucu hatası");
  }
  return result;
}

async function command(n,action){
  try{
    await request("/api/command",{led:n,action});
    await refresh();
    message(`LED ${n}: ${action==="on"?"Açma":"Kapatma"} komutu gönderildi.`);
  }catch(e){message(e.message);}
}

async function setBrightness(n,value){
  value=Math.max(0,Math.min(100,Number(value)));
  try{
    await request("/api/command",{
      led:n,action:"brightness",brightness:value
    });
    await refresh();
    message(`LED ${n} parlaklığı %${value} olarak ayarlandı.`);
  }catch(e){message(e.message);}
}

async function refresh(){
  try{
    const result=await request("/api/state");
    data=result.target;
    render();
    $("connection").className="status online";
    $("connection").querySelector("span").textContent =
      result.bridgeOnline ? "Arduino bağlantısı aktif" : "Sunucu bağlı · Arduino bekleniyor";
  }catch(e){
    $("connection").className="status";
    $("connection").querySelector("span").textContent="Bağlantı yok";
    message(e.message);
  }
}

function saveSettings(){
  api=$("serverUrl").value.trim().replace(/\/$/,"");
  token=$("token").value.trim();
  localStorage.setItem("shc_url",api);
  localStorage.setItem("shc_token",token);
  message("Bağlantı bilgileri kaydedildi.");
  refresh();
}

function parseVoice(text){
  const t=text.toLocaleLowerCase("tr-TR");
  const ledMatch=t.match(/led\s*(1|bir|2|iki)/);
  if(!ledMatch) return "LED 1 veya LED 2 belirtmelisin.";

  const n=["1","bir"].includes(ledMatch[1])?1:2;

  if(/kapat|söndür/.test(t)){
    command(n,"off");
    return `LED ${n} kapatılıyor.`;
  }

  if(/\baç\b|yak/.test(t) && !/yüzde|parlaklık/.test(t)){
    command(n,"on");
    return `LED ${n} açılıyor.`;
  }

  const percent=t.match(/(?:yüzde\s*)?(\d{1,3})\s*(?:%|yüzde)?/);
  if(percent){
    const value=Math.min(100,Number(percent[1]));
    setBrightness(n,value);
    return `LED ${n} parlaklığı %${value} yapılıyor.`;
  }

  if(/yarım|elli|50/.test(t)){
    setBrightness(n,50);
    return `LED ${n} %50 yapılıyor.`;
  }
  if(/tam|sonuna kadar|yüzde yüz|100/.test(t)){
    setBrightness(n,100);
    return `LED ${n} %100 yapılıyor.`;
  }

  return "Komutu anlayamadım. Örneğin LED 1 yüzde 40 yap diyebilirsin.";
}

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

$("micButton").addEventListener("click",()=>{
  if(!SpeechRecognition){
    message("Bu tarayıcı ses tanımayı desteklemiyor. Android Chrome ile dene.");
    return;
  }
  const recognition=new SpeechRecognition();
  recognition.lang="tr-TR";
  recognition.interimResults=false;
  recognition.onstart=()=>{
    $("micButton").classList.add("listening");
    $("voiceText").textContent="Dinliyorum...";
  };
  recognition.onend=()=>{
    $("micButton").classList.remove("listening");
    $("voiceText").innerHTML='Mikrofona bas ve komutunu söyle.<br>Örnek: “LED 1 yüzde 35 yap.”';
  };
  recognition.onresult=e=>{
    const spoken=e.results[0][0].transcript;
    $("voiceText").textContent="Duyulan: "+spoken;
    message(parseVoice(spoken));
  };
  recognition.onerror=()=>{
    message("Mikrofon kullanılamadı. Tarayıcı mikrofon iznini kontrol et.");
  };
  recognition.start();
});

render();
refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
