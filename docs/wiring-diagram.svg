<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">SMART HOME CONTROL Arduino Nano and two MOSFET LED channels</title>
  <desc id="desc">Arduino Nano D5 and D6 drive two low-side MOSFET gates. An external LED supply powers each load and shares ground with the Nano.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dce7f4"/></marker>
    <style>
      .bg{fill:#0b1220}.box{fill:#172338;stroke:#52627a;stroke-width:2}.head{fill:#f4bd35;font:700 22px Arial}.label{fill:#f4f7fb;font:16px Arial}.small{fill:#adbacb;font:13px Arial}.wire{fill:none;stroke:#dce7f4;stroke-width:4}.pwm{fill:none;stroke:#f4bd35;stroke-width:4}.power{fill:none;stroke:#f47777;stroke-width:5}.ground{fill:none;stroke:#8ba0ba;stroke-width:4}.part{fill:#202f45;stroke:#91a4bd;stroke-width:2}.green{fill:#35d39a}.terminal{fill:#f4f7fb}
    </style>
  </defs>
  <rect class="bg" width="1120" height="650" rx="22"/>
  <text x="44" y="48" class="head">SMART HOME CONTROL · Arduino Nano · 2 × PWM LED</text>
  <rect x="55" y="110" width="300" height="370" rx="18" class="box"/>
  <text x="90" y="150" class="head">ARDUINO NANO</text>
  <text x="85" y="220" class="label">USB ← tablet OTG / computer</text>
  <rect x="80" y="265" width="180" height="55" rx="10" class="part"/><text x="102" y="299" class="label">D5 · PWM · LED 1</text>
  <rect x="80" y="350" width="180" height="55" rx="10" class="part"/><text x="102" y="384" class="label">D6 · PWM · LED 2</text>
  <rect x="80" y="430" width="180" height="32" rx="8" class="part"/><text x="126" y="452" class="label">GND</text>
  <text x="460" y="117" class="head">KANAL 1</text><text x="810" y="117" class="head">KANAL 2</text>
  <path class="pwm" d="M260 293H465"/><rect x="315" y="278" width="78" height="30" rx="7" class="part"/><text x="332" y="299" class="small">100 Ω</text>
  <path class="pwm" d="M393 293H520V224H555"/>
  <path class="pwm" d="M260 378H815"/><rect x="555" y="363" width="78" height="30" rx="7" class="part"/><text x="572" y="384" class="small">100 Ω</text><path class="pwm" d="M633 378H900V309H935"/>
  <rect x="485" y="160" width="245" height="55" rx="12" class="part"/><text x="530" y="194" class="label">LED 1 load / strip</text>
  <rect x="835" y="245" width="245" height="55" rx="12" class="part"/><text x="880" y="279" class="label">LED 2 load / strip</text>
  <path class="power" d="M607 160V132H957V245"/>
  <text x="712" y="125" class="small">External supply +V (match LED voltage)</text>
  <path class="wire" d="M607 215V250"/><path class="wire" d="M957 300V335"/>
  <rect x="540" y="250" width="135" height="74" rx="14" class="part"/><text x="556" y="279" class="label">Q1 logic FET</text><text x="580" y="302" class="small">D · S · G</text>
  <rect x="890" y="335" width="135" height="74" rx="14" class="part"/><text x="906" y="364" class="label">Q2 logic FET</text><text x="930" y="387" class="small">D · S · G</text>
  <path class="ground" d="M607 324V485H765"/><path class="ground" d="M957 409V485H765"/><path class="ground" d="M260 446H420V540H765"/>
  <rect x="735" y="515" width="130" height="55" rx="12" class="part"/><text x="758" y="548" class="label">Supply 0V</text>
  <path class="ground" d="M765 485V515"/>
  <path class="wire" d="M540 293H465V244"/><path class="wire" d="M890 378H835V330"/>
  <text x="450" y="355" class="small">10 kΩ gate pull-down to GND (each MOSFET)</text>
  <text x="55" y="610" class="small">Nano GND and external supply 0V must be common. Never power LED loads from Nano pins.</text>
</svg>

