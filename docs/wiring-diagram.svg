<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Arduino Nano ve L298N ile 12 volt şerit LED bağlantısı</title>
  <desc id="desc">Nano D5 ve D6 PWM ile ENA ve ENB'yi sürer. D7-D10 IN1-IN4'e gider. Şerit LED'ler L298N OUT1-OUT2 ve OUT3-OUT4 çiftlerine bağlanır.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.board{fill:#172338;stroke:#7386a2;stroke-width:2}.head{fill:#f4bd35;font:700 22px Arial}.label{fill:#f4f7fb;font:16px Arial}.small{fill:#bdc9d8;font:13px Arial}.pin{fill:#263750;stroke:#8194ae;stroke-width:1.5}.control{fill:none;stroke:#f4bd35;stroke-width:3}.out{fill:none;stroke:#7bd8b2;stroke-width:3}.power{fill:none;stroke:#f47777;stroke-width:4}.ground{fill:none;stroke:#9aabc1;stroke-width:3}.load{fill:#202f45;stroke:#91a4bd;stroke-width:2}.plus{fill:#f47777;font:700 16px Arial}.minus{fill:#9aabc1;font:700 16px Arial}
    </style>
  </defs>
  <rect class="bg" width="1120" height="700" rx="20"/>
  <text x="40" y="48" class="head">12 V ŞERİT LED · ARDUINO NANO + L298N</text>
  <text x="40" y="76" class="small">Harici direnç yok · 12 V, akım sınırlaması kendi üzerinde olan şerit LED kullanın</text>

  <rect x="45" y="120" width="270" height="390" rx="16" class="board"/>
  <text x="92" y="160" class="head">ARDUINO NANO</text>
  <text x="76" y="216" class="label">D5 · PWM</text><text x="76" y="253" class="label">D6 · PWM</text>
  <text x="76" y="310" class="label">D7</text><text x="76" y="347" class="label">D8</text>
  <text x="76" y="384" class="label">D9</text><text x="76" y="421" class="label">D10</text>
  <text x="76" y="475" class="label">GND</text>
  <circle cx="270" cy="210" r="5" class="pin"/><circle cx="270" cy="247" r="5" class="pin"/>
  <circle cx="270" cy="304" r="5" class="pin"/><circle cx="270" cy="341" r="5" class="pin"/>
  <circle cx="270" cy="378" r="5" class="pin"/><circle cx="270" cy="415" r="5" class="pin"/>
  <circle cx="270" cy="469" r="5" class="pin"/>

  <rect x="410" y="120" width="300" height="390" rx="16" class="board"/>
  <text x="493" y="160" class="head">L298N</text>
  <text x="440" y="216" class="label">ENA</text><text x="440" y="253" class="label">ENB</text>
  <text x="440" y="310" class="label">IN1</text><text x="440" y="347" class="label">IN2</text>
  <text x="440" y="384" class="label">IN3</text><text x="440" y="421" class="label">IN4</text>
  <text x="440" y="475" class="label">GND</text>
  <text x="600" y="216" class="label">OUT1</text><text x="600" y="253" class="label">OUT2</text>
  <text x="600" y="347" class="label">OUT3</text><text x="600" y="384" class="label">OUT4</text>
  <text x="440" y="500" class="small">+12V / Vs: kart beslemesi</text>
  <circle cx="700" cy="210" r="5" class="pin"/><circle cx="700" cy="247" r="5" class="pin"/>
  <circle cx="700" cy="304" r="5" class="pin"/><circle cx="700" cy="341" r="5" class="pin"/>
  <circle cx="700" cy="378" r="5" class="pin"/><circle cx="700" cy="415" r="5" class="pin"/>
  <circle cx="700" cy="469" r="5" class="pin"/>

  <path class="control" d="M275 210H410"/><path class="control" d="M275 247H410"/>
  <path class="control" d="M275 304H410"/><path class="control" d="M275 341H410"/>
  <path class="control" d="M275 378H410"/><path class="control" d="M275 415H410"/>
  <text x="323" y="195" class="small">D5→ENA</text><text x="323" y="234" class="small">D6→ENB</text>
  <text x="323" y="292" class="small">D7→IN1</text><text x="323" y="329" class="small">D8→IN2</text>
  <text x="323" y="366" class="small">D9→IN3</text><text x="313" y="403" class="small">D10→IN4</text>

  <rect x="835" y="170" width="235" height="130" rx="15" class="load"/>
  <text x="872" y="205" class="head">ŞERİT LED 1</text><text x="854" y="250" class="plus">+  OUT1</text><text x="854" y="280" class="minus">−  OUT2</text>
  <path class="out" d="M705 210H815V250H835"/><path class="out" d="M705 247H800V280H835"/>

  <rect x="835" y="325" width="235" height="130" rx="15" class="load"/>
  <text x="872" y="360" class="head">ŞERİT LED 2</text><text x="854" y="405" class="plus">+  OUT3</text><text x="854" y="435" class="minus">−  OUT4</text>
  <path class="out" d="M705 378H790V405H835"/><path class="out" d="M705 415H815V435H835"/>

  <rect x="435" y="565" width="270" height="82" rx="14" class="load"/>
  <text x="475" y="600" class="label">12 V GÜÇ KAYNAĞI</text><text x="475" y="628" class="small">+12 V (+) · 0 V (−)</text>
  <path class="power" d="M705 585H760V535H560V510"/>
  <text x="770" y="535" class="plus">+12 V → L298N +12V/Vs</text>
  <path class="ground" d="M570 647V660H25V469H270"/><path class="ground" d="M700 469V660"/>
  <text x="780" y="552" class="small">Nano GND, L298N GND ve</text><text x="780" y="572" class="small">besleme 0 V ortak olmalı</text>

  <text x="45" y="690" class="small">ENA/ENB jumper'larını çıkarın. 5V-EN farklıdır; kart kılavuzuna göre kullanın.</text>
</svg>

